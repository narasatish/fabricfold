databases:
  - name: fabricfold-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: fabricfold
    runtime: node
    plan: starter
    region: singapore
    # Render skips its default `npm install` when a custom buildCommand is
    # given (fixed: "prisma: not found" on the first deploy). --include=dev
    # is needed too: devDependencies hold @types/web-push, required for the
    # build's own type-check, not the running app — Render's production
    # install skips devDependencies by default; Vercel's build step doesn't,
    # which is why this never surfaced there.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fabricfold-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: fabricfold-db
          property: connectionString
      # Found live 2026-09-17 via scripts/load-test.ts: 300 concurrent users
      # produced a 92.56% error rate ("timeout exceeded when trying to
      # connect") — lib/db.ts's pool defaults to 4 connections for the whole
      # app, comment-justified by Supabase's transaction pooler recycling
      # connections per-query, a reasoning that no longer applies now that
      # production runs on Render's OWN direct Postgres (fabricfold-db
      # above), not Supabase. 10 is a conservative bump, not a researched
      # ceiling — Render's own connection-limit-per-plan table wasn't
      # fetchable from here (JS-rendered pricing page), so this is sized to
      # be safely within reach of even a small paid Postgres plan while
      # meaningfully raising headroom, not a claim that 10 is optimal.
      # Override here (no code change needed, see lib/db.ts) once the
      # actual plan connection limit is confirmed on Render's dashboard.
      - key: DB_POOL_MAX
        value: "10"
      - key: NODE_ENV
        value: production
      # Secrets below: NOT set here. Fill in the actual values in the Render
      # dashboard (Environment tab) after the first deploy — same values
      # currently in Vercel's project settings, copied over, not regenerated.
      - key: AUTH_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: GOOGLE_SA_EMAIL
        sync: false
      - key: GOOGLE_SA_PRIVATE_KEY
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_BUSINESS_NUMBER
        sync: false
      - key: WHATSAPP_ORDER_TEMPLATE
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_TEMPLATE_LANG
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

  # ── Cron jobs ─────────────────────────────────────────────────────────
  # Each one just calls the SAME API route the app already uses on Vercel —
  # no business logic rewritten, no new code to trust. It's the same
  # CRON_SECRET-gated endpoint, just triggered by Render's scheduler instead
  # of Vercel's. Schedules copied exactly from vercel.json (UTC, unchanged).
  - type: cron
    name: cron-report-daily
    runtime: node
    plan: starter
    region: singapore
    schedule: "30 15 * * *"
    buildCommand: "echo no build needed"
    startCommand: 'curl -sf -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/report/daily"'
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: fabricfold
          property: hostport

  - type: cron
    name: cron-backup
    runtime: node
    plan: starter
    region: singapore
    schedule: "0 20 * * *"
    buildCommand: "echo no build needed"
    startCommand: 'curl -sf -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/backup"'
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: fabricfold
          property: hostport

  - type: cron
    name: cron-sheets-sync
    runtime: node
    plan: starter
    region: singapore
    # Aggregate tabs (Live/Daily/Plans/Students) are a full rebuild, not an
    # append — hourly keeps them close to the DB without hammering the
    # Sheets API. The per-event log tabs (Orders/Payments/Collections) don't
    # need this: flushSoon() already pushes those within seconds of each
    # action, and this cron is just their once-daily backstop sweep.
    schedule: "0 * * * *"
    buildCommand: "echo no build needed"
    startCommand: 'curl -sf -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/sheets/sync"'
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: fabricfold
          property: hostport

  - type: cron
    name: cron-sheets-flush
    runtime: node
    plan: starter
    region: singapore
    schedule: "15 21 * * *"
    buildCommand: "echo no build needed"
    startCommand: 'curl -sf -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/sheets/flush"'
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: fabricfold
          property: hostport

  - type: cron
    name: cron-purge-photos
    runtime: node
    plan: starter
    region: singapore
    schedule: "0 22 * * *"
    buildCommand: "echo no build needed"
    startCommand: 'curl -sf -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/purge-photos"'
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: fabricfold
          property: hostport

  - type: cron
    name: cron-collection-reminders
    runtime: node
    plan: starter
    region: singapore
    schedule: "30 12 * * *"
    buildCommand: "echo no build needed"
    startCommand: 'curl -sf -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/collection-reminders"'
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: fabricfold
          property: hostport

  - type: cron
    name: cron-error-digest
    runtime: node
    plan: starter
    region: singapore
    schedule: "0 6 * * *"
    buildCommand: "echo no build needed"
    startCommand: 'curl -sf -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/error-digest"'
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: fabricfold
          property: hostport

  - type: cron
    name: cron-weekly-digest
    runtime: node
    plan: starter
    region: singapore
    schedule: "30 3 * * 1"
    buildCommand: "echo no build needed"
    startCommand: 'curl -sf -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/weekly-digest"'
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: fabricfold
          property: hostport

  # In-app watchdog (2026-09-16): every 5 minutes, not once a day like
  # cron-error-digest above — a real server exception at 2am should reach the
  # Owner within minutes, not wait for the 6am rollup. Marks what it reports
  # `seen`, so the daily digest doesn't repeat it.
  - type: cron
    name: cron-watchdog
    runtime: node
    plan: starter
    region: singapore
    schedule: "*/5 * * * *"
    buildCommand: "echo no build needed"
    startCommand: 'curl -sf -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/watchdog"'
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: fabricfold
          property: hostport

  # External uptime probe (2026-09-16): deliberately does NOT call into the
  # app at all for the alert itself — every OTHER cron above depends on the
  # app being up to do anything, including cron-watchdog just above, whose
  # own endpoint is unreachable in exactly the scenario ("the app is fully
  # down") that matters most. This one emails Resend directly with curl, so
  # it still fires when fabricfold.in itself is completely unreachable.
  # RESEND_API_KEY/MAIL_FROM/OWNER_EMAIL are the same secrets the app's own
  # lib/mail.ts uses — set once in the Render dashboard, reused here.
  - type: cron
    name: cron-uptime-watchdog
    runtime: node
    plan: starter
    region: singapore
    schedule: "*/5 * * * *"
    buildCommand: "echo no build needed"
    startCommand: |
      sh -c '
        if curl -sf --max-time 15 -o /dev/null "$APP_URL/login"; then
          exit 0
        fi
        if [ -z "$RESEND_API_KEY" ] || [ -z "$OWNER_EMAIL" ]; then
          echo "fabricfold.in/login did not respond, and RESEND_API_KEY/OWNER_EMAIL are not set — cannot alert"
          exit 1
        fi
        curl -s -X POST https://api.resend.com/emails \
          -H "Authorization: Bearer $RESEND_API_KEY" \
          -H "Content-Type: application/json" \
          -d "{\"from\":\"${MAIL_FROM:-FabricFold <onboarding@resend.dev>}\",\"to\":[\"$OWNER_EMAIL\"],\"subject\":\"FabricFold: site not responding\",\"text\":\"fabricfold.in/login did not return 200 within 15 seconds. Check the Render dashboard now: https://dashboard.render.com\"}" \
          -o /dev/null
        exit 1
      '
    envVars:
      - key: APP_URL
        fromService:
          type: web
          name: fabricfold
          property: hostport
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: OWNER_EMAIL
        sync: false
