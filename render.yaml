databases:
  - name: fabricfold-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: fabricfold
    runtime: node
    plan: starter
    region: singapore
    # Render skips its default `npm install` when a custom buildCommand is
    # given, which is what produced "sh: 1: prisma: not found" on the first
    # deploy — the build ran before dependencies existed. Installing
    # explicitly first fixes it.
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fabricfold-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: fabricfold-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Secrets below: NOT set here. Fill in the actual values in the Render
      # dashboard (Environment tab) after the first deploy — same values
      # currently in Vercel's project settings, copied over, not regenerated.
      - key: AUTH_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: GOOGLE_SA_EMAIL
        sync: false
      - key: GOOGLE_SA_PRIVATE_KEY
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_BUSINESS_NUMBER
        sync: false
      - key: WHATSAPP_ORDER_TEMPLATE
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_TEMPLATE_LANG
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

  # ── Cron jobs ─────────────────────────────────────────────────────────
  # Each one just calls the SAME API route the app already uses on Vercel —
  # no business logic rewritten, no new code to trust. It's the same
  # CRON_SECRET-gated endpoint, just triggered by Render's scheduler instead
  # of Vercel's. Schedules copied exactly from vercel.json (UTC, unchanged).
  - type: cron
    name: cron-report-daily
    runtime: node
    plan: starter
    region: singapore
    schedule: "30 15 * * *"
    buildCommand: "echo no build needed"
    startCommand: 'curl -sf -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/report/daily"'
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: fabricfold
          property: hostport

  - type: cron
    name: cron-backup
    runtime: node
    plan: starter
    region: singapore
    schedule: "0 20 * * *"
