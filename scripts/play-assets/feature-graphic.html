<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @import url('');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: linear-gradient(120deg, #0b7a5e 0%, #0e9271 55%, #16a883 100%);
    position: relative;
    color: #fff;
  }
  /* soft texture — suggestion of folded linen, kept subtle */
  .wash {
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 380px at 78% 18%, rgba(255,255,255,.16), transparent 60%),
      radial-gradient(700px 320px at 12% 92%, rgba(0,0,0,.16), transparent 60%);
  }
  .stripes {
    position: absolute; inset: 0; opacity: .07;
    background: repeating-linear-gradient(115deg, #fff 0 2px, transparent 2px 26px);
  }
  /* Play crops the outer edges on some surfaces — keep everything inside this */
  .safe { position: absolute; left: 72px; top: 0; height: 500px; display: flex; align-items: center; }
  .mark {
    display: flex; align-items: center; gap: 14px; margin-bottom: 18px;
  }
  .logo {
    width: 54px; height: 54px; border-radius: 15px;
    background: #fff; display: grid; place-items: center;
    box-shadow: 0 8px 22px rgba(0,0,0,.18);
  }
  .logo svg { width: 32px; height: 32px; }
  .brand { font-size: 30px; font-weight: 700; letter-spacing: -.4px; }
  h1 {
    font-size: 52px; line-height: 1.06; font-weight: 800;
    letter-spacing: -1.6px; max-width: 560px;
  }
  .sub {
    margin-top: 16px; font-size: 20px; line-height: 1.4;
    color: rgba(255,255,255,.9); max-width: 500px; font-weight: 400;
  }
  .pills { margin-top: 26px; display: flex; gap: 10px; }
  .pill {
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28);
    padding: 9px 16px; border-radius: 999px; font-size: 15px; font-weight: 600;
    backdrop-filter: blur(2px);
  }
  /* phone on the right */
  .phone {
    position: absolute; right: 76px; top: 50%; transform: translateY(-50%) rotate(-4deg);
    width: 236px; height: 430px; border-radius: 34px;
    background: #0d1a16; padding: 9px;
    box-shadow: 0 30px 70px rgba(0,0,0,.34), 0 0 0 1px rgba(255,255,255,.10);
  }
  .screen {
    width: 100%; height: 100%; border-radius: 26px; background: #f4f7f5;
    overflow: hidden; position: relative;
  }
  .sbar { height: 30px; background: #0e9271; }
  .card {
    margin: 12px; background: #fff; border-radius: 12px; padding: 11px 12px;
    box-shadow: 0 2px 8px rgba(12,40,32,.07);
  }
  .lbl { font-size: 8.5px; color: #71827b; letter-spacing: .5px; font-weight: 700; }
  .val { font-size: 14px; color: #0f1f19; font-weight: 700; margin-top: 3px; }
  .row { display: flex; align-items: center; gap: 7px; margin-top: 9px; }
  .dot { width: 15px; height: 15px; border-radius: 50%; background: #0e9271; display: grid; place-items: center; flex: none; }
  .dot.gray { background: #dfe7e3; }
  .step { font-size: 9.5px; color: #0f1f19; font-weight: 600; }
  .step.mut { color: #a8b5af; font-weight: 500; }
  .tick { width: 8px; height: 8px; }
  .cta {
    margin: 14px 12px 0; background: #0e9271; color: #fff; border-radius: 10px;
    text-align: center; padding: 10px 0; font-size: 11.5px; font-weight: 700;
    box-shadow: 0 4px 12px rgba(14,146,113,.32);
  }
  .tabs {
    position: absolute; left: 0; right: 0; bottom: 0; height: 44px;
    background: #fff; border-top: 1px solid #eef3f1;
    display: flex; align-items: center; justify-content: space-around;
  }
  .tab { color: #c3cec9; }
  .tab.on { color: #0e9271; }
  .tab svg { width: 15px; height: 15px; display: block; }
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="stripes"></div>

  <div class="safe">
    <div>
      <div class="mark">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0e9271" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8h12l-1 12a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 8Z"/>
            <path d="M9 8V6a3 3 0 0 1 6 0v2"/>
          </svg>
        </div>
        <div class="brand">FabricFold</div>
      </div>

      <h1>Campus laundry,<br/>tracked end to end.</h1>
      <div class="sub">Book from your room. Every garment tagged. Collect with a code.</div>

      <div class="pills">
        <div class="pill">Book</div>
        <div class="pill">Track</div>
        <div class="pill">Collect</div>
      </div>
    </div>
  </div>

  <div class="phone">
    <div class="screen">
      <div class="sbar"></div>
      <div class="card">
        <div class="lbl">ORDER #4821</div>
        <div class="val">Wash &amp; Iron · 8 pcs</div>
        <div class="row">
          <div class="dot"><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
          <div class="step">Received at counter</div>
        </div>
        <div class="row">
          <div class="dot"><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
          <div class="step">Washing</div>
        </div>
        <div class="row">
          <div class="dot gray"></div>
          <div class="step mut">Ready to collect</div>
        </div>
      </div>
      <div class="card">
        <div class="lbl">ESTIMATED READY</div>
        <div class="val">Tomorrow · 6pm</div>
      </div>
      <div class="card" style="background:#e8f5f0;">
        <div class="lbl" style="color:#0b7a5e;">PLAN</div>
        <div class="val" style="color:#0b7a5e;">21 of 34 cycles left</div>
      </div>
      <div class="cta">+ New order</div>
      <div class="tabs">
        <div class="tab on">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
        </div>
        <div class="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.4"/><circle cx="3.5" cy="12" r="1.4"/><circle cx="3.5" cy="18" r="1.4"/></svg>
        </div>
        <div class="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18"/></svg>
        </div>
        <div class="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
